---
# UOMS cPanel Deployment Configuration
# 
# Struktur di server:
# /home/hlmy9571/
# ├── laravel/           # Backend Laravel (di luar public_html untuk keamanan)
# │   ├── app/
# │   ├── bootstrap/
# │   ├── config/
# │   ├── database/
# │   ├── resources/
# │   ├── routes/
# │   ├── storage/
# │   ├── vendor/
# │   ├── artisan
# │   ├── composer.json
# │   └── composer.lock
# └── public_html/        # Web root
#     ├── api/            # Backend entry point (index.php)
#     ├── assets/         # Frontend assets
#     └── index.html      # Frontend entry

deployment:
  tasks:
    # ===== Create Directories =====
    - /bin/mkdir -p /home/hlmy9571/public_html
    - /bin/mkdir -p /home/hlmy9571/public_html/api
    - /bin/mkdir -p /home/hlmy9571/laravel
    - /bin/mkdir -p /home/hlmy9571/laravel/app
    - /bin/mkdir -p /home/hlmy9571/laravel/bootstrap
    - /bin/mkdir -p /home/hlmy9571/laravel/config
    - /bin/mkdir -p /home/hlmy9571/laravel/database
    - /bin/mkdir -p /home/hlmy9571/laravel/resources
    - /bin/mkdir -p /home/hlmy9571/laravel/routes
    - /bin/mkdir -p /home/hlmy9571/laravel/storage
    - /bin/mkdir -p /home/hlmy9571/laravel/storage/framework/cache
    - /bin/mkdir -p /home/hlmy9571/laravel/storage/framework/sessions
    - /bin/mkdir -p /home/hlmy9571/laravel/storage/framework/views
    - /bin/mkdir -p /home/hlmy9571/laravel/storage/logs
    - /bin/mkdir -p /home/hlmy9571/laravel/bootstrap/cache
    - /bin/mkdir -p /home/hlmy9571/laravel/vendor

    # ===== Deploy Frontend =====
    - /bin/cp -R frontend/dist/. /home/hlmy9571/public_html/

    # ===== Deploy Backend Laravel Core =====
    - /bin/cp -R backend/app/. /home/hlmy9571/laravel/app/
    - /bin/cp -R backend/config/. /home/hlmy9571/laravel/config/
    - /bin/cp -R backend/database/. /home/hlmy9571/laravel/database/
    - /bin/cp -R backend/resources/. /home/hlmy9571/laravel/resources/
    - /bin/cp -R backend/routes/. /home/hlmy9571/laravel/routes/
    - /bin/cp -R backend/storage/. /home/hlmy9571/laravel/storage/
    - /bin/cp -R backend/vendor/. /home/hlmy9571/laravel/vendor/

    # ===== Deploy Bootstrap (Use Production Version) =====
    - /bin/cp -R backend/bootstrap/. /home/hlmy9571/laravel/bootstrap/
    - /bin/cp backend/bootstrap/app.production.php /home/hlmy9571/laravel/bootstrap/app.php

    # ===== Deploy Public Files to API Folder =====
    - /bin/cp -R backend/public/. /home/hlmy9571/public_html/api/
    - /bin/cp backend/public/index.production.php /home/hlmy9571/public_html/api/index.php

    # ===== Deploy Root Files =====
    - /bin/cp backend/artisan /home/hlmy9571/laravel/
    - /bin/cp backend/composer.json /home/hlmy9571/laravel/
    - /bin/cp backend/composer.lock /home/hlmy9571/laravel/

    # ===== Set Permissions =====
    - /bin/chmod -R 755 /home/hlmy9571/laravel/storage
    - /bin/chmod -R 755 /home/hlmy9571/laravel/bootstrap/cache
